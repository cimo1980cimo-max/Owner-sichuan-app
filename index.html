    const useLocalStorage = (key, initial) => {
      const [value, setValue] = useState(() => {
        try {
          const stored = localStorage.getItem(key);
          return stored ? JSON.parse(stored) : initial;
        } catch {
          return initial;
        }
      });
      
      useEffect(() => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      }, [key, value]);
      
      return [value, setValue];
    };
    
    const useScrollProgress = () => {
      const [progress, setProgress] = useState(0);
      
      useEffect(() => {
        const handleScroll = () => {
          const scrollTop = window.scrollY;
          const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
          setProgress(scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0);
        };
        
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      
      return progress;
    };
    
    const useMediaQuery = (query) => {
      const [matches, setMatches] = useState(() => 
        typeof window !== 'undefined' ? window.matchMedia(query).matches : false
      );
      
      useEffect(() => {
        const mql = window.matchMedia(query);
        const handler = (e) => setMatches(e.matches);
        mql.addEventListener('change', handler);
        return () => mql.removeEventListener('change', handler);
      }, [query]);
      
      return matches;
    };

        setRemaining(seconds);
        setRunning(false);

            if (prev <= 1) {

              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
              onComplete?.();
              return 0;
            }
            return prev - 1;

        h('main', {

          className: 'max-w-6xl mx-auto px-4 sm:px-6 py-8'
        },
          view === 'home' && h(HomePage, {
            recipes: RECIPES,
            onSelectRecipe: (id) => { setSelectedRecipe(id); setView('recipe'); },
            lang,
            onToggleLang: () => setLang(lang === 'ar' ? 'fr' : 'ar')
          }),
          
          view === 'recipe' && h(RecipeDetail, {
            recipe,
            lang,
            portions,
            setPortions
          }),
          
          view === 'videos' && h(VideosPage, { recipes: RECIPES, lang }),
          
          view === 'admin' && h(AdminPage, { lang }),
          
          // Back button
          view !== 'home' && h('button', {
            onClick: () => { setView('home'); setSelectedRecipe(null); },
            className: 'mt-8 h-11 rounded-full px-6 text-sm font-bold',
            style: { background: 'white', border: '1px solid var(--border)' }
          }, lang === 'ar' ? '← رجوع للرئيسية' : '← Retour à l\'accueil')
        ),
        
        // Footer
        h('footer', {
          className: 'mt-16 py-8',
          style: { borderTop: '1px solid var(--border)', background: 'white' }
        },
          h('div', { className: 'max-w-6xl mx-auto px-4 sm:px-6' },
            h('div', { className: 'flex flex-wrap items-center justify-between gap-4' },
              h('div', { className: 'text-sm', style: { color: 'var(--muted)' } },
                `© 2025 Sichuan.fr · ${RECIPES.length} ${lang === 'ar' ? 'وصفة' : 'recettes'}`
              ),
              h('div', { className: 'flex gap-4 text-xs', style: { color: 'var(--muted)' } },
                h('a', { href: '#', className: 'hover:underline' }, lang === 'ar' ? 'الخصوصية' : 'Confidentialité'),
                h('a', { href: '#', className: 'hover:underline' }, lang === 'ar' ? 'الشروط' : 'Conditions'),
                h('a', { href: '#', className: 'hover:underline' }, 'AdSense')
              )
            )
          )
        )
      );
    };
    
    // ============================================
    // MOUNT
    // ============================================
    
    const root = createRoot(document.getElementById('root'));
    root.render(h(App));
    
  </script>
  
  <!-- PWA Manifest (inline) -->
  <script>
    const manifest = {
      name: 'Sichuan.fr - Recettes Authentiques',
      short_name: 'Sichuan',
      description: '11 recettes Sichuan avec vidéos, minuteurs et portions ajustables',
      start_url: '/',
      display: 'standalone',
      background_color: '#FFF7ED',
      theme_color: '#D92D20',
      icons: [
        {
          src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌶️</text></svg>',
          sizes: '192x192',
          type: 'image/svg+xml'
        }
      ]
    };
    
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  </script>
</body>
